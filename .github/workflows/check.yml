name: Check

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # Every package's build (the wrappers type-check against the built core), types incl. svelte-check, unit specs:
      # the same gate `bun run bump` runs before a release.
      - name: Types, build, specs
        run: bun run check
      # The poster (packages/emaki-posting/poster) is python on the standard library only: no install step.
      # The same specs with V8 coverage of packages/*/src; below 100% (vitest.config.js thresholds) it fails.
      - name: Coverage
        run: bun run coverage
      - name: Poster (python)
        run: python3 -B -m unittest discover -s packages/emaki-posting/spec -p 'test_*.py'

  browser:
    # The example app in real Chromium: the figure, the player and the capture contract the video pipeline uses.
    # ubuntu-24.04: Playwright installs Chromium's system dependencies there.
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the packages
        run: bun run build:all
      - name: Install Chromium
        # From the example, so bunx uses its pinned playwright; at the root it fetches the latest, whose Chromium build
        # is not the one the pinned version launches.
        working-directory: examples/svelte
        run: bunx playwright install --with-deps chromium
      - name: Example app in the browser
        run: bun run test:browser
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: examples/svelte/test-results/
          if-no-files-found: ignore

  site:
    # emaki.sensei-hq.com: the docs copies match docs/llms, svelte-check, the component specs in Chromium, and the
    # prerender (every route, both llms files).
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the packages
        run: bun run build:all
      - name: Install Chromium
        # From the site, so bunx uses its pinned playwright (see the browser job).
        working-directory: site
        run: bunx playwright install --with-deps chromium
      - name: Types
        working-directory: site
        run: bun run check
      - name: Specs
        working-directory: site
        run: bun run test
      - name: Prerender
        working-directory: site
        run: bun run build
